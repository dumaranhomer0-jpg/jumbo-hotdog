
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Gallery — My Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #fafafa; color: #333; }

    /* Navigation bar styles */
    nav {
      background: #333;
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 1000;
    }
    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      padding: 10px 0;
      margin: 0;
    }
    nav ul li {
      margin: 0 15px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      transition: background-color 0.3s;
    }
    nav ul li a:hover {
      background-color: #555;
      border-radius: 4px;
    }

    header {
      background: #4b6cb7;
      color: white;
      padding: 30px 0;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .gallery-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-item .caption {
      text-align: center;
      padding: 8px;
      background: rgba(255,255,255,0.9);
    }
  </style>
</head>
<body>

  <!-- Navigation bar -->
  <nav>
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="about me.html">About</a></li>
      <li><a href="project.html">Projects</a></li>
      <li><a href="collection.html">Collection</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header>
    <h1>My Photo Collection</h1>
  </header>

  <div class="gallery-container">
    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="31.jpg" alt="Photo 1">
        <div class="caption">UTUGAN 1</div>
      </div>
      <div class="gallery-item">
        <img src="king utog.jpg" alt="Photo 2">
        <div class="caption">UTUGAN 2</div>
      </div>
      <div class="gallery-item">
        <img src="33.jpg" alt="Photo 3">
        <div class="caption">UTUGAN 3</div>
      </div>
      <div class="gallery-item">
        <img src="homs.jpg" alt="Photo 4">
        <div class="caption">UTUGAN 4</div>
      </div>
      <div class="gallery-item">
        <img src="35.jpg" alt="Photo 5">
        <div class="caption">UTUGAN SA LAHAT</div>
      </div>
      <!-- add more items here -->
    </div>
  </div>

</body>
</html>
